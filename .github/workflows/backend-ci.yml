on:
  push:
    branches:
      - master
    paths:
      - 'Ecommerce_backend/**'
  pull_request:
    branches:
      - master
    paths:
      - 'Ecommerce_backend/**'
jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecommerce_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Ecommerce_backend/pom.xml
      - name: Build and run tests
        run: mvn -B clean verify
