# DB
spring.application.name=Ecommerce
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mail
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}
# Security
app.jwt.secret=${JWT_SECRET_KEY}

# Razorpay
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_KEY_SECRET}

# Frontend
app.frontend.success-url=${FRONTEND_URL_PAYMENT}
app.frontend.url=http://localhost:5173/

# Admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.keep-alive=3m
spring.ai.retry.max-attempts=1
# PgVector
spring.ai.vectorstore.pgvector.table-name=document_chunks
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

# AI advisor logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# JDBC chat memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# AI
app.rag.enabled=false
