#db
spring.application.name=Ecommerce
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#security
app.jwt.secret=${JWT_SECRET_KEY}
#razorpay
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_KEY_SECRET}
#frontend url
app.frontend.success-url=${FRONTEND_URL_PAYMENT}
app.frontend.url=http://localhost:3000

#admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
#Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5-coder:7b
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.retry.max-attempts=1
spring.ai.ollama.chat.keep-alive=0m
#PgVector Setup
spring.ai.vectorstore.pgvector.table-name=product_embeddings
spring.ai.vectorstore.pgvector.dimension=768
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
